[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Build the independent SaaS only when deploying its dedicated branch.
[context."feat/saas-foundation"]
  command = "npm run build:product"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false

[functions]
  included_files = ["public/**"]
